[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chtec-csv-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["chtec>=0.1.0"]

[project.entry-points."chtec.formats"]
csv = "chtec_csv:register"

[tool.setuptools]
py-modules = ["chtec_csv"]
