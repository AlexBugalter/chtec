[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chtec"
version = "0.8.0"
description = "Handwritten document transcription with local and cloud models"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7", "Pillow>=12,<13", "PyMuPDF>=1.26,<2", "python-docx>=1.2,<2", "rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]

[project.urls]
Repository = "https://github.com/AlexBugalter/chtec"
Issues = "https://github.com/AlexBugalter/chtec/issues"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]
heic = ["pillow-heif>=1.1"]

[project.gui-scripts]
chtec = "chtec.__main__:main"

[tool.setuptools.packages.find]
include = ["chtec*"]

[tool.setuptools.package-data]
"chtec.ui" = ["en.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
